#@TYPE: Machine
#@NAME: SA525M-EMMC
#@DESCRIPTION: Machine configuration for SA525M EMMC

require conf/machine/include/qcom-sa535m.inc

# MACHINE_FEATURES ##
MACHINE_FEATURES += "emmc-boot"

KERNEL_DEVICETREE:pn-linux-qcom-custom = " \
                      qcom/sa535m-emmc-tdp.dtb \
                      "

KERNEL_CONFIG = "qcom_telematics_base_defconfig"
KERNEL_CONFIG_FRAGMENTS = "${S}/arch/arm64/configs/vendor/sa535m.config"
KERNEL_CONFIG_FRAGMENTS:append = " ${@oe.utils.vartrue('DEBUG_BUILD', '${S}/arch/arm64/configs/vendor/sa535m-debug.config', '', d)}"

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4  = "325058560"
USERDATA_SIZE_EXT4 = "251658240"
CACHE_SIZE_EXT4 = "26214400"
SYSTEMRW_SIZE_EXT4 = "8192000"
PERSIST_SIZE_EXT4  = "6291456"
PAGE_SIZE ?= '4096'

SLOT_A_SUFFIX = ""

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
MACHINE_FSCONFIG_CONF = "sa535m-emmc-fsconfig.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "sa535m-emmc-filesmap"

MACHINE_PARTITION_CONF = "sa535m-partition.conf"
