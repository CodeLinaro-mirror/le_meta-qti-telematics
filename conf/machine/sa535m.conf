#@TYPE: Machine
#@NAME: sa535m
#@DESCRIPTION: Machine configuration for Qualcomm SA535M chipset.

require conf/machine/include/qcom-sa535m.inc
MACHINE_FEATURES += "nand-boot"

KERNEL_DEVICETREE:pn-linux-qcom-custom = " \
                      qcom/sa535m-nand-tdp.dtb \
                      "

# Additional dtbo to overylay on top of kernel devicetree files
KERNEL_TECH_DTBOS[sa535m-nand-tdp] = " \
                      sa535m-audio.dtbo \
                      sa535m-qti-can.dtbo \
                      sa535m-cnss.dtbo \
                      sa535m-bt.dtbo \
                      sa535m-eth.dtbo \
                      ${@bb.utils.contains('MACHINE_FEATURES', 'qti-isim', 'sa535m-isim.dtbo', '', d)} \
                      "

# Recipe providers of above dtbo files.
KERNEL_TECH_DTBO_PROVIDERS = " \
                      audiodevicetree \
                      can-kernel-devicetree \
                      wlan-devicetree \
                      bt-devicetree \
                      data-devicetree \
                      ${@bb.utils.contains('MACHINE_FEATURES', 'qti-isim', 'isim-devicetree', '', d)} \
                      "

# sa535m does not support audio/cnss/bt dtbos
KERNEL_TECH_DTBOS[sa535m-nand-tdp] = " \
                      sa535m-qti-can.dtbo \
                      ${@bb.utils.contains('MACHINE_FEATURES', 'qti-isim', 'sa535m-isim.dtbo', '', d)} \
                      "
KERNEL_TECH_DTBO_PROVIDERS = " \
                      can-kernel-devicetree \
                      ${@bb.utils.contains('MACHINE_FEATURES', 'qti-isim', 'isim-devicetree', '', d)} \
                      "

KERNEL_CONFIG = "qcom_telematics_base_defconfig"
KERNEL_CONFIG_FRAGMENTS = "${S}/arch/arm64/configs/vendor/sa535m.config"
KERNEL_CONFIG_FRAGMENTS:append = " ${@oe.utils.vartrue('DEBUG_BUILD', '${S}/arch/arm64/configs/vendor/sa535m-debug.config', '', d)}"

# Default Image names
BOOTIMAGE_TARGET   ?= "boot.img"
SYSTEMIMAGE_TARGET ?= "sysfs.ubi"

# Formats of root filesystem images
IMAGE_FSTYPES += "ubi"

# Sizes for UBI volumes
SYSTEM_VOLUME_SIZE = "150MiB"
CACHE_VOLUME_SIZE    = "6MiB"
SYSTEMRW_VOLUME_SIZE = "6MiB"
PERSIST_VOLUME_SIZE  = "6MiB"
ISIM_VOLUME_SIZE = "80MiB"

# UBI arguments
PAGE_SIZE ?= '4096'
UBINIZE_ARGS = "-m 4096 -p 256KiB -s 4096"
MKUBIFS_ARGS = "-m 4096 -e 253952 -c 2146 -F"
MKUBIFS_USERFS_ARGS = "-m 4096 -e 253952 -c 6144 -F"

# Sizes for UBI squashfs volumes
SYSTEM_SQUASHFS_VOLUME_SIZE = "${@bb.utils.contains('DEBUG_BUILD', '1', '90MiB', '85MiB', d)}"
MODEM_SQUASHFS_VOLUME_SIZE = "125MiB"
