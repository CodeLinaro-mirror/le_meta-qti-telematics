#@TYPE: Machine
#@NAME: sa535m
#@DESCRIPTION: Machine configuration for Qualcomm SA535M chipset.

require conf/machine/include/qcom-sa535m.inc

KERNEL_DEVICETREE:pn-linux-qcom-custom = " \
                      qcom/sa535m-nand-tdp.dtb \
                      "

# Additional dtbo to overylay on top of kernel devicetree files
KERNEL_TECH_DTBOS[sa535m-nand-tdp] = " \
    "

# Recipe providers of above dtbo files.
KERNEL_TECH_DTBO_PROVIDERS = "\
"

KERNEL_CONFIG = "qcom_telematics_base_defconfig"
KERNEL_CONFIG_FRAGMENTS = "${S}/arch/arm64/configs/vendor/sa535m.config"
KERNEL_CONFIG_FRAGMENTS:append = " ${@oe.utils.vartrue('DEBUG_BUILD', '${S}/arch/arm64/configs/vendor/sa535m-debug.config', '', d)}"

# Formats of root filesystem images
IMAGE_FSTYPES += "ubi"

# Sizes for UBI volumes
SYSTEM_VOLUME_SIZE = "125MiB"
CACHE_VOLUME_SIZE    = "10MiB"
SYSTEMRW_VOLUME_SIZE = "6MiB"
PERSIST_VOLUME_SIZE  = "4MiB"

# UBI arguments
PAGE_SIZE ?= '4096'
UBINIZE_ARGS = "-m 4096 -p 256KiB -s 4096"
MKUBIFS_ARGS = "-m 4096 -e 253952 -c 2146 -F"
MKUBIFS_USERFS_ARGS = "-m 4096 -e 253952 -c 6144 -F"
